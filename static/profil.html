<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil – Tuxpedia</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Belleza&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="/landing.css" rel="stylesheet">
<link href="/profil.css" rel="stylesheet">
</head>
<body>

<!-- ===== Navbar (sama dengan beranda) ===== -->
<nav class="navbar navbar-expand-lg fixed-top site-nav">
  <div class="container">
    <div class="nav-shell">
      <a class="navbar-brand brand" href="/#beranda"><img class="brand-logo" src="/img/logo.png" alt="" width="40" height="40"><span class="brand-text">Tuxpedia<small>Kenalan dengan Linux</small></span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="/#beranda">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="/#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/#contact">Contact</a></li>
          <li class="nav-item"><a class="nav-link active" href="/profil" aria-current="page">Profil</a></li>
        </ul>
        <div class="auth-area d-flex align-items-center gap-2">
          <div class="d-flex align-items-center gap-3" id="userBox">
            <span class="user-name" id="userName"></span>
            <button type="button" class="btn btn-ghost btn-sm-pill" id="btnKeluar">KELUAR</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<main>
<section class="section profil-section">
  <div class="container">
    <h1 class="section-title">Profil</h1>
    <p class="lead-text mb-4">Kelola data akunmu di sini.</p>

    <div class="panel">
      <div class="row g-5">
        <div class="col-lg-4 text-center">
          <div class="avatar" id="avatar">D</div>
          <h2 class="profil-name" id="profilName">Halo!</h2>
          <p class="profil-email" id="profilEmail"></p>
        </div>

        <div class="col-lg-8">
          <form id="profileForm" novalidate>
            <div id="profileAlert" role="status"></div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="pName" class="form-label">Nama</label>
                <input type="text" id="pName" name="name" class="form-control" placeholder="Nama lengkap" autocomplete="name" maxlength="80" required>
              </div>
              <div class="col-md-6">
                <label for="pEmail" class="form-label">Email</label>
                <input type="email" id="pEmail" name="email" class="form-control" autocomplete="email" readonly aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">Email tidak bisa diubah.</div>
              </div>
              <div class="col-md-6">
                <label for="pCity" class="form-label">Kota</label>
                <input type="text" id="pCity" name="city" class="form-control" placeholder="Kota" autocomplete="address-level2" maxlength="80">
              </div>
              <div class="col-12">
                <label for="pAddress" class="form-label">Alamat</label>
                <input type="text" id="pAddress" name="address" class="form-control" placeholder="Alamat" autocomplete="street-address" maxlength="200">
              </div>
            </div>
            <button type="submit" class="btn btn-main mt-4">SIMPAN PERUBAHAN</button>
          </form>

          <hr class="my-5">
          <form id="passwordForm" novalidate>
            <h2 class="h5 mb-3">Ganti kata sandi</h2>
            <div id="passwordAlert" role="status"></div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="pCurrent" class="form-label">Kata sandi saat ini</label>
                <input type="password" id="pCurrent" name="current" class="form-control" autocomplete="current-password" maxlength="128" required>
              </div>
              <div class="col-md-6">
                <label for="pNew" class="form-label">Kata sandi baru</label>
                <input type="password" id="pNew" name="next" class="form-control" placeholder="Min. 10 karakter" autocomplete="new-password" minlength="10" maxlength="128" required>
              </div>
            </div>
            <button type="submit" class="btn btn-main mt-4">GANTI KATA SANDI</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
</main>

<footer class="site-footer">
  <div class="container">
    <p class="copy">© 2026 Tuxpedia. Linux® adalah merek dagang Linus Torvalds.</p>
  </div>
</footer>

</body>
</html>
