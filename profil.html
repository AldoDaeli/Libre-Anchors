<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <!-- Font pixel mirip "Monaco" (judul) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />

    <style>
      :root {
        --green: #bedd8a;
        --pink: #f18fa4;
        --ink: #2b2b2b;
        --font-heading: "Monaco", "Pixelify Sans", monospace;
        /* Optima tersedia di Mac/iOS; Candara/Segoe UI sebagai cadangan di Windows/Android */
        --font-body: "Optima", "Candara", "URW Classico", "Segoe UI", sans-serif;
      }

      body {
        padding: 10px;
        min-height: 100vh;
        font-family: var(--font-body);
        color: var(--ink);
        background: linear-gradient(to bottom, var(--green), var(--pink)) fixed;
      }

      h1,
      .navbar-brand {
        font-family: var(--font-heading);
        letter-spacing: 0.5px;
      }

      h1 {
        margin-top: 1.5rem;
      }

      .navbar {
        background: rgba(255, 255, 255, 0.55) !important;
        backdrop-filter: blur(6px);
        border-radius: 16px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      }

      .nav-link {
        color: var(--ink);
      }
      .nav-link.active,
      .nav-link:hover {
        color: #c2506b;
      }

      .profile-card {
        background: rgba(255, 255, 255, 0.55);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        max-width: 900px;
        margin: 0 auto 24px;
      }

      .form-label {
        font-weight: 600;
      }

      .form-control {
        font-family: var(--font-body);
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 12px;
      }
      .form-control:focus {
        border-color: var(--pink);
        box-shadow: 0 0 0 0.2rem rgba(241, 143, 164, 0.35);
      }

      .form-check-input:checked {
        background-color: var(--pink);
        border-color: var(--pink);
      }
      .form-check-input:focus {
        border-color: var(--pink);
        box-shadow: 0 0 0 0.2rem rgba(241, 143, 164, 0.35);
      }

      .btn-primary {
        font-family: var(--font-heading);
        background-color: var(--pink);
        border-color: var(--pink);
        color: #fff;
        border-radius: 12px;
        padding: 8px 20px;
      }
      .btn-primary:hover,
      .btn-primary:focus {
        background-color: #e17690;
        border-color: #e17690;
        color: #fff;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Website</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link active" aria-current="page" href="#">login</a>
            <a class="nav-link" href="/profil.html">Profil</a>
            <a class="nav-link" href="#">Beranda</a>
          </div>
        </div>
      </div>
    </nav>

    <div class="container-fluid" style="max-width: 900px">
      <h1>Profil</h1>
      <p>kelola akun anda</p>
    </div>

    <div class="profile-card">
      <form class="row g-3">
        <div class="col-md-6">
          <label for="inputEmail4" class="form-label">Email</label>
          <input type="email" class="form-control" id="inputEmail4" placeholder="contoh@gmail.com" />
        </div>
        <div class="col-md-6">
          <label for="inputPassword4" class="form-label">Password</label>
          <input type="password" class="form-control" id="inputPassword4" placeholder="**********" />
        </div>
        <div class="col-12">
          <label for="inputAddress" class="form-label">Address</label>
          <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St" />
        </div>
        <div class="col-md-6">
          <label for="inputCity" class="form-label">City</label>
          <input type="text" class="form-control" id="inputCity" />
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck" />
            <label class="form-check-label" for="gridCheck"> Check me out </label>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Ubah profile</button>
        </div>
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
